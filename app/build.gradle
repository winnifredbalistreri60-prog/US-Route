plugins { id 'com.android.application' }
android {
 namespace 'app.usroute'
 compileSdk 35
 useLibrary 'android.test.runner', false
 useLibrary 'android.test.base', false
 useLibrary 'android.test.mock', false
 defaultConfig { applicationId 'app.usroute'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
 testOptions { unitTests.all { maxHeapSize = '384m'; maxParallelForks = 1 } }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
